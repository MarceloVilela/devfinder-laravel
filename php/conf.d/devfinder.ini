; Lido pelo Bref no Lambda (php/conf.d/*.ini do projeto). Fase 7, OWASP API8 e API3.
; Não anuncia a versão do PHP no cabeçalho X-Powered-By.
expose_php=0
; Stack trace nunca leva os argumentos das funções (tokens, senhas e chaves passam como argumento), mesmo se algum log o imprimir.
zend.exception_ignore_args=1
